<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="42%" cy="44%" r="75%">
      <stop offset="0%" stop-color="#0b111e"/><stop offset="60%" stop-color="#070b14"/><stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16223a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="f-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7eefc"/><stop offset="100%" stop-color="#aebbd6"/>
    </linearGradient>
    <linearGradient id="f-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c6"/><stop offset="100%" stop-color="#6f7d9c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <!-- corner ticks -->
  <g stroke="#2e5cff" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M24 24H50M24 24V50"/><path d="M1176 24H1150M1176 24V50"/>
    <path d="M24 536H50M24 536V510"/><path d="M1176 536H1150M1176 536V510"/>
  </g>

  <!-- header -->
  <rect x="40" y="46" width="116" height="30" rx="6" fill="none" stroke="#54a1ff" stroke-width="1.4"/>
  <text x="98" y="66" text-anchor="middle" fill="#8ab4ff" font-size="15" letter-spacing="3" font-family="ui-monospace,'SF Mono',monospace">PHASE 01</text>
  <text x="172" y="68" fill="#e8eefc" font-size="24" font-weight="700" letter-spacing="1">THE LOW-POLY PROTOTYPE</text>
  <text x="42" y="98" fill="#5f7cad" font-size="14" letter-spacing="1" font-family="ui-monospace,'SF Mono',monospace">a steerable pyramid · its nose points where you fly</text>

  <!-- direction heading line -->
  <g stroke="#54a1ff" stroke-dasharray="2 7" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M770 290 H1010" fill="none"/>
  </g>
  <path d="M1010 290 l-16 -7 v14 z" fill="#54a1ff"/>
  <text x="1006" y="272" text-anchor="end" fill="#8ab4ff" font-size="13" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">HEADING</text>

  <!-- low-poly dart/pyramid, nose pointing right -->
  <g stroke="#cdd8f0" stroke-width="1.4" stroke-linejoin="round">
    <!-- far/back face (dark) -->
    <polygon points="760,290 430,200 410,300" fill="#3c455c"/>
    <!-- bottom face -->
    <polygon points="760,290 410,300 470,392" fill="#4c5670"/>
    <!-- top face (light) -->
    <polygon points="760,290 430,200 540,232" fill="url(#f-top)"/>
    <!-- near/right face (mid) -->
    <polygon points="760,290 540,232 470,392" fill="url(#f-side)"/>
    <!-- inner ridge lines for low-poly read -->
    <line x1="760" y1="290" x2="540" y2="232" opacity="0.7"/>
    <line x1="760" y1="290" x2="470" y2="392" opacity="0.7"/>
  </g>
  <!-- nose marker -->
  <circle cx="760" cy="290" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="760" cy="290" r="13" fill="none" stroke="#54a1ff" stroke-width="2" opacity="0.8"/>

  <!-- vertex dots (low-poly emphasis) -->
  <g fill="#9fb4dd">
    <circle cx="430" cy="200" r="3"/><circle cx="540" cy="232" r="3"/>
    <circle cx="410" cy="300" r="3"/><circle cx="470" cy="392" r="3"/>
  </g>

  <!-- joystick (nipplejs-style) bottom-left -->
  <g transform="translate(120 450)">
    <circle r="58" fill="#1e1e1e" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle r="26" fill="#ffffff" fill-opacity="0.85"/>
    <text x="0" y="92" text-anchor="middle" fill="#5f7cad" font-size="12" letter-spacing="3" font-family="ui-monospace,'SF Mono',monospace">JOYSTICK</text>
  </g>

  <!-- spec note -->
  <text x="1160" y="500" text-anchor="end" fill="#3f567f" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">FLAT-SHADED · ~6 TRIS · NO TEXTURES</text>
  <text x="1160" y="520" text-anchor="end" fill="#3f567f" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">FREE-ORBIT CAMERA</text>
</svg>
