<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="46%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b111e"/><stop offset="60%" stop-color="#070b14"/><stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16223a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="p-blue" cx="35%" cy="32%" r="75%"><stop offset="0%" stop-color="#bcd8ff"/><stop offset="45%" stop-color="#4f8fe0"/><stop offset="100%" stop-color="#163a66"/></radialGradient>
    <radialGradient id="p-amber" cx="35%" cy="32%" r="75%"><stop offset="0%" stop-color="#ffe0b0"/><stop offset="45%" stop-color="#e8954a"/><stop offset="100%" stop-color="#6e3c12"/></radialGradient>
    <radialGradient id="p-teal" cx="35%" cy="32%" r="75%"><stop offset="0%" stop-color="#b7f3e2"/><stop offset="45%" stop-color="#3fb89a"/><stop offset="100%" stop-color="#114b3f"/></radialGradient>
    <radialGradient id="p-violet" cx="35%" cy="32%" r="75%"><stop offset="0%" stop-color="#e3ccff"/><stop offset="45%" stop-color="#9466d6"/><stop offset="100%" stop-color="#3a2363"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff4e6"/><stop offset="45%" stop-color="#ff9a55"/><stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="f-top" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e7eefc"/><stop offset="100%" stop-color="#aebbd6"/></linearGradient>
    <linearGradient id="f-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9aa8c6"/><stop offset="100%" stop-color="#6f7d9c"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#2e5cff" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M24 24H50M24 24V50"/><path d="M1176 24H1150M1176 24V50"/>
    <path d="M24 536H50M24 536V510"/><path d="M1176 536H1150M1176 536V510"/>
  </g>

  <rect x="40" y="46" width="116" height="30" rx="6" fill="none" stroke="#54a1ff" stroke-width="1.4"/>
  <text x="98" y="66" text-anchor="middle" fill="#8ab4ff" font-size="15" letter-spacing="3" font-family="ui-monospace,'SF Mono',monospace">PHASE 03</text>
  <text x="172" y="68" fill="#e8eefc" font-size="24" font-weight="700" letter-spacing="1">A SYSTEM OF WORLDS</text>
  <text x="42" y="98" fill="#5f7cad" font-size="14" letter-spacing="1" font-family="ui-monospace,'SF Mono',monospace">plain spheres on evenly-spaced orbits — textures come next</text>

  <!-- planetary system (top-down) -->
  <g transform="translate(560 330)">
    <!-- orbit rings -->
    <g fill="none" stroke="#22324f" stroke-width="1.5">
      <circle r="70"/><circle r="120"/><circle r="170"/><circle r="215"/>
    </g>
    <!-- central star/core -->
    <circle r="34" fill="url(#core)"/>
    <circle r="9" fill="#fff4e6" filter="url(#glow)"/>

    <!-- planets (flat-shaded, NO surface texture yet) -->
    <circle cx="58" cy="-39" r="13" fill="url(#p-blue)"/>
    <circle cx="-96" cy="72" r="17" fill="url(#p-amber)"/>
    <circle cx="150" cy="80" r="11" fill="url(#p-teal)"/>

    <!-- one frozen planet with pulsing boundary + paused tag -->
    <g transform="translate(-150 -150)">
      <circle r="33" fill="none" stroke="#54a1ff" stroke-width="2" stroke-dasharray="4 5" opacity="0.9"/>
      <circle r="19" fill="url(#p-violet)"/>
      <text x="0" y="-44" text-anchor="middle" fill="#8ab4ff" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">PAUSED ‖</text>
    </g>

    <!-- the vessel approaching -->
    <g transform="translate(-150 -150) rotate(35)">
      <g transform="translate(0 70)" stroke="#cdd8f0" stroke-width="1.3" stroke-linejoin="round" filter="url(#glow)">
        <polygon points="0,-22 -15,26 0,15" fill="url(#f-side)"/>
        <polygon points="0,-22 0,15 15,26" fill="url(#f-top)"/>
      </g>
    </g>
  </g>

  <!-- legend / mechanic note -->
  <g font-family="ui-monospace,'SF Mono',monospace">
    <text x="42" y="300" fill="#9fb4dd" font-size="14" letter-spacing="2">ORBITAL LOGIC</text>
    <line x1="42" y1="312" x2="250" y2="312" stroke="#22324f" stroke-width="1.5"/>
    <text x="42" y="340" fill="#6f8cbf" font-size="13">› maximise spacing between worlds</text>
    <text x="42" y="364" fill="#6f8cbf" font-size="13">› enter the inner ring → planet freezes</text>
    <text x="42" y="388" fill="#6f8cbf" font-size="13">› leave → it accelerates to catch up</text>
  </g>

  <text x="1160" y="520" text-anchor="end" fill="#3f567f" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">8 BODIES · SHARED ANGULAR SPEED</text>
</svg>
