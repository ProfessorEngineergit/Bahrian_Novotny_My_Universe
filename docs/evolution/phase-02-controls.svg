<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#0b111e"/><stop offset="60%" stop-color="#070b14"/><stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16223a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="f-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7eefc"/><stop offset="100%" stop-color="#aebbd6"/>
    </linearGradient>
    <linearGradient id="f-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c6"/><stop offset="100%" stop-color="#6f7d9c"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <g stroke="#2e5cff" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M24 24H50M24 24V50"/><path d="M1176 24H1150M1176 24V50"/>
    <path d="M24 536H50M24 536V510"/><path d="M1176 536H1150M1176 536V510"/>
  </g>

  <rect x="40" y="46" width="116" height="30" rx="6" fill="none" stroke="#54a1ff" stroke-width="1.4"/>
  <text x="98" y="66" text-anchor="middle" fill="#8ab4ff" font-size="15" letter-spacing="3" font-family="ui-monospace,'SF Mono',monospace">PHASE 02</text>
  <text x="172" y="68" fill="#e8eefc" font-size="24" font-weight="700" letter-spacing="1">DISCIPLINED CONTROLS</text>
  <text x="42" y="98" fill="#5f7cad" font-size="14" letter-spacing="1" font-family="ui-monospace,'SF Mono',monospace">fewer degrees of freedom = a more polished feel</text>

  <!-- camera orbit system around the vessel -->
  <g transform="translate(440 320)">
    <!-- full faint orbit -->
    <circle r="160" fill="none" stroke="#22324f" stroke-width="1.5" stroke-dasharray="3 6"/>
    <!-- allowed sweep (±60deg around 'home' at top) -->
    <path d="M -138.6 -80 A 160 160 0 0 1 138.6 -80" fill="none" stroke="#54a1ff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <!-- limit ticks -->
    <line x1="-138.6" y1="-80" x2="-159" y2="-92" stroke="#54a1ff" stroke-width="2"/>
    <line x1="138.6" y1="-80" x2="159" y2="-92" stroke="#54a1ff" stroke-width="2"/>
    <text x="-176" y="-96" text-anchor="end" fill="#8ab4ff" font-size="12" font-family="ui-monospace,'SF Mono',monospace">-60°</text>
    <text x="176" y="-96" fill="#8ab4ff" font-size="12" font-family="ui-monospace,'SF Mono',monospace">+60°</text>

    <!-- camera glyph at an offset, snapping back to home -->
    <g transform="rotate(40)">
      <g transform="translate(0 -160)">
        <rect x="-16" y="-12" width="26" height="24" rx="4" fill="#0d1626" stroke="#cdd8f0" stroke-width="1.6"/>
        <polygon points="10,-8 24,-14 24,14 10,8" fill="#0d1626" stroke="#cdd8f0" stroke-width="1.6"/>
      </g>
    </g>
    <!-- snap-back spring arrow -->
    <path d="M 103 -123 A 160 160 0 0 0 6 -159" fill="none" stroke="#7fb4ff" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>
    <path d="M6 -159 l 14 -3 l -7 13 z" fill="#7fb4ff"/>
    <text x="120" y="-150" fill="#7fb4ff" font-size="13" letter-spacing="1" font-family="ui-monospace,'SF Mono',monospace">spring-back</text>

    <!-- home marker -->
    <circle cx="0" cy="-160" r="4" fill="#ffffff"/>
    <text x="0" y="-182" text-anchor="middle" fill="#9fb4dd" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">HOME</text>

    <!-- the vessel (top-down low-poly dart) -->
    <g stroke="#cdd8f0" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)">
      <polygon points="0,-46 -30,52 0,30" fill="url(#f-side)"/>
      <polygon points="0,-46 0,30 30,52" fill="url(#f-top)"/>
    </g>
  </g>

  <!-- zoom rail -->
  <g transform="translate(900 0)">
    <text x="60" y="146" text-anchor="middle" fill="#bcd6ff" font-size="15" letter-spacing="4" font-family="ui-monospace,'SF Mono',monospace">ZOOM</text>
    <line x1="60" y1="180" x2="60" y2="430" stroke="#3f567f" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="180" x2="60" y2="320" stroke="#54a1ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="46" y1="180" x2="74" y2="180" stroke="#7fb4ff" stroke-width="2.4"/>
    <line x1="46" y1="430" x2="74" y2="430" stroke="#46608c" stroke-width="2.4"/>
    <text x="90" y="185" fill="#9fc0ff" font-size="13" font-family="ui-monospace,'SF Mono',monospace">25 · far</text>
    <text x="90" y="435" fill="#6f8cbf" font-size="13" font-family="ui-monospace,'SF Mono',monospace">8 · near</text>
    <circle cx="60" cy="320" r="13" fill="#0d1626" stroke="#ffffff" stroke-width="2.4" filter="url(#glow)"/>
    <text x="90" y="325" fill="#dbe6ff" font-size="13" font-family="ui-monospace,'SF Mono',monospace">persistent</text>
  </g>

  <text x="1160" y="520" text-anchor="end" fill="#3f567f" font-size="12" letter-spacing="2" font-family="ui-monospace,'SF Mono',monospace">SPRING-DAMPED CAMERA · CLAMPED ZOOM</text>
</svg>
