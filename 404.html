<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>404 — Lost in Space</title>
<style>
  @font-face{
    font-family:'Nasalization V2';
    src:url('https://professorengineergit.github.io/Bahrian_Novotny_My_Universe/Nasalization%20V2.woff2') format('woff2');
    font-display:swap;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;}
  canvas{display:block;position:fixed;inset:0;z-index:0;}
  #overlay{
    position:fixed; left:0; right:0; bottom:0; top:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    padding:0 24px calc(7vh + env(safe-area-inset-bottom));
    pointer-events:none; text-align:center;
    font-family:'Nasalization V2', system-ui, -apple-system, sans-serif; color:#fff;
  }
  .lead{
    margin:0 0 10px; font-size:clamp(15px, 2.6vw, 22px); letter-spacing:.04em;
    color:#fff; text-shadow:0 0 18px rgba(255,40,60,.45), 0 2px 10px rgba(0,0,0,.6);
  }
  .sub{
    margin:0 0 26px; max-width:560px; font-size:clamp(12px, 1.9vw, 15px); line-height:1.6;
    color:rgba(210,222,255,.72); text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  .warp-home{
    pointer-events:auto; display:inline-flex; align-items:center; gap:10px;
    padding:13px 26px; border-radius:999px; cursor:pointer; text-decoration:none;
    color:#fff; font-size:clamp(13px,1.8vw,15px); letter-spacing:.06em;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 8px 40px rgba(0,0,0,.4), inset 0 0 24px rgba(255,255,255,.05);
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .warp-home:hover{ background:rgba(255,255,255,.14); transform:translateY(-1px);
    box-shadow:0 10px 50px rgba(86,156,255,.35), inset 0 0 24px rgba(255,255,255,.08); }
  .warp-home .arrow{ font-size:1.15em; transform:translateY(-1px); }
  #signal{
    position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:3;
    font-family:'Nasalization V2', system-ui, monospace; font-size:12px; letter-spacing:.34em;
    color:rgba(255,60,80,.75); text-shadow:0 0 12px rgba(255,40,60,.6);
  }
  /* faint scanline / signal-loss vignette */
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
}}
</script>
</head>
<body>
  <div id="signal">⚠ SIGNAL LOST · SECTOR 404</div>
  <div id="vignette"></div>
  <div id="overlay">
    <p class="lead">You've drifted past the edge of the known universe.</p>
    <p class="sub">This sector isn't on any star chart — whatever lies beyond simply hasn't been written yet. Best turn the ship around.</p>
    <a class="warp-home" href="https://professorengineergit.github.io/Bahrian_Novotny_My_Universe/"><span class="arrow">⤺</span> Warp home</a>
  </div>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const rand = (a, b) => a + Math.random() * (b - a);
const RED = 0xff2330;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 0, 33);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.55, 0.18);
composer.addPass(bloom);

/* --- Galaxy backdrop (face-on, slowly spinning) --- */
function createGalaxy() {
  const count = 55000, radius = 100, arms = 3, spin = 0.7, rnd = 0.5, pow = 3;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const cIn = new THREE.Color('#ffac89'), cOut = new THREE.Color('#54a1ff');
  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const r = Math.random() * radius;
    const spinAngle = r * spin;
    const branch = (i % arms) / arms * Math.PI * 2;
    const rx = Math.pow(Math.random(), pow) * (Math.random() < .5 ? 1 : -1) * rnd * r;
    const ry = Math.pow(Math.random(), pow) * (Math.random() < .5 ? 1 : -1) * rnd * r * 0.1;
    const rz = Math.pow(Math.random(), pow) * (Math.random() < .5 ? 1 : -1) * rnd * r;
    positions[i3] = Math.cos(branch + spinAngle) * r + rx;
    positions[i3 + 1] = ry;
    positions[i3 + 2] = Math.sin(branch + spinAngle) * r + rz;
    const c = cIn.clone().lerp(cOut, r / radius);
    colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.2, 'rgba(255,255,255,1)');
  g.addColorStop(.5, 'rgba(255,255,255,.3)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  const mat = new THREE.PointsMaterial({ size: 0.28, sizeAttenuation: true, depthWrite: false,
    blending: THREE.AdditiveBlending, vertexColors: true, map: new THREE.CanvasTexture(cv), transparent: true, opacity: 1 });
  return new THREE.Points(geo, mat);
}
const galaxyGroup = new THREE.Group();
galaxyGroup.position.z = -72;
galaxyGroup.rotation.x = 0.32;
scene.add(galaxyGroup);
const galaxy = createGalaxy();
galaxy.rotation.x = -Math.PI / 2;
galaxy.scale.setScalar(1.85);
galaxyGroup.add(galaxy);

/* --- Soft red "broken signal" haze behind the 404 --- */
const glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = 256;
const gx = glowCv.getContext('2d');
const gg = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
gg.addColorStop(0, 'rgba(255,45,75,0.5)'); gg.addColorStop(0.4, 'rgba(150,30,90,0.2)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
gx.fillStyle = gg; gx.fillRect(0, 0, 256, 256);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCv),
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
glow.scale.set(78, 44, 1); glow.position.set(0, 0, -14);
scene.add(glow);

/* --- Sparks --- */
const SPARK_COUNT = 600;
const sparkPos = new Float32Array(SPARK_COUNT * 3).fill(99999);
const sparkVel = new Float32Array(SPARK_COUNT * 3);
const sparkLife = new Float32Array(SPARK_COUNT);
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparkMat = new THREE.PointsMaterial({ color: 0xff8a3a, size: 0.4, blending: THREE.AdditiveBlending,
  transparent: true, depthWrite: false, sizeAttenuation: true });
scene.add(new THREE.Points(sparkGeo, sparkMat));
let sparkCursor = 0;
function emitSpark(x, y, z) {
  for (let n = 0; n < SPARK_COUNT; n++) {
    const i = (sparkCursor++) % SPARK_COUNT;
    if (sparkLife[i] <= 0) {
      const i3 = i * 3;
      sparkPos[i3] = x; sparkPos[i3 + 1] = y; sparkPos[i3 + 2] = z;
      sparkVel[i3] = rand(-11, 11); sparkVel[i3 + 1] = rand(-7, 13); sparkVel[i3 + 2] = rand(-11, 11);
      sparkLife[i] = rand(0.4, 1.1);
      return;
    }
  }
}
function updateSparks(dt) {
  for (let i = 0; i < SPARK_COUNT; i++) {
    if (sparkLife[i] <= 0) continue;
    sparkLife[i] -= dt;
    const i3 = i * 3;
    sparkPos[i3] += sparkVel[i3] * dt;
    sparkPos[i3 + 1] += sparkVel[i3 + 1] * dt;
    sparkPos[i3 + 2] += sparkVel[i3 + 2] * dt;
    sparkVel[i3 + 1] -= 14 * dt;
    sparkVel[i3] *= 0.95; sparkVel[i3 + 1] *= 0.95; sparkVel[i3 + 2] *= 0.95;
    if (sparkLife[i] <= 0) { sparkPos[i3] = sparkPos[i3 + 1] = sparkPos[i3 + 2] = 99999; }
  }
  sparkGeo.attributes.position.needsUpdate = true;
}

/* --- 404 text + breaking shards --- */
let text = null, ghost = null, textVerts = null, textWidth = 30;
const shards = [];

function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const vFOV = THREE.MathUtils.degToRad(camera.fov);
  const distW = ((textWidth / 2 + 4) / aspect) / Math.tan(vFOV / 2);
  const distH = (8 / Math.tan(vFOV / 2));
  camera.position.z = Math.max(distW, distH, 22);
}

function randVertex() {
  const n = textVerts.length / 3;
  const i = (Math.random() * n | 0) * 3;
  return new THREE.Vector3(textVerts[i], textVerts[i + 1], textVerts[i + 2]);
}
function makeShard() {
  const g = Math.random() < 0.5
    ? new THREE.BoxGeometry(rand(0.5, 1.5), rand(0.5, 1.5), rand(0.5, 1.5))
    : new THREE.TetrahedronGeometry(rand(0.5, 1.2));
  const m = new THREE.LineBasicMaterial({ color: RED, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false });
  const s = new THREE.LineSegments(new THREE.WireframeGeometry(g), m);
  scene.add(s);
  const o = { mesh: s, vel: new THREE.Vector3(), ang: new THREE.Vector3(), life: 0, max: 1, delay: 0 };
  resetShard(o); o.life = -rand(0, 4);
  return o;
}
function resetShard(o) {
  const v = randVertex();
  o.mesh.position.copy(v);
  o.vel.copy(v).setLength(rand(2, 4)).add(new THREE.Vector3(rand(-3, 3), rand(-3, 3), rand(1, 6)));
  o.ang.set(rand(-3, 3), rand(-3, 3), rand(-3, 3));
  o.max = rand(0.9, 1.9);
  o.delay = rand(0.4, 3.2);
  o.life = -o.delay;
  o.mesh.material.opacity = 0;
}
function updateShard(o, dt) {
  const was = o.life;
  o.life += dt;
  if (was < 0 && o.life >= 0) { for (let i = 0; i < 7; i++) emitSpark(o.mesh.position.x, o.mesh.position.y, o.mesh.position.z); }
  if (o.life < 0) { o.mesh.material.opacity = 0; return; }
  o.mesh.position.addScaledVector(o.vel, dt);
  o.vel.multiplyScalar(0.985);
  o.mesh.rotation.x += o.ang.x * dt; o.mesh.rotation.y += o.ang.y * dt; o.mesh.rotation.z += o.ang.z * dt;
  o.mesh.material.opacity = Math.max(0, 1 - o.life / o.max) * 0.95;
  if (o.life >= o.max) resetShard(o);
}

const fontLoader = new FontLoader();
fontLoader.load('https://unpkg.com/three@0.150.1/examples/fonts/helvetiker_bold.typeface.json', (font) => {
  const geo = new TextGeometry('404', { font, size: 12, height: 3.2, curveSegments: 5,
    bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.3, bevelSegments: 1 });
  geo.center();
  geo.computeBoundingBox();
  textWidth = geo.boundingBox.max.x - geo.boundingBox.min.x;
  fitCamera();
  textVerts = geo.attributes.position.array;
  const wire = new THREE.WireframeGeometry(geo);
  text = new THREE.LineSegments(wire, new THREE.LineBasicMaterial({ color: RED, transparent: true,
    opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(text);
  ghost = new THREE.LineSegments(wire, new THREE.LineBasicMaterial({ color: 0x39d0ff, transparent: true,
    opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(ghost);
  for (let i = 0; i < 50; i++) shards.push(makeShard());
  window.__ready = true;
});

/* --- Glitch + loop --- */
const clock = new THREE.Clock();
let glitchTimer = 1.2, glitching = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  galaxyGroup.rotation.z += 0.035 * dt;
  updateSparks(dt);
  for (const s of shards) updateShard(s, dt);

  glitchTimer -= dt;
  if (glitchTimer <= 0) { glitching = rand(0.05, 0.22); glitchTimer = rand(0.7, 2.8); }

  if (text) {
    if (glitching > 0) {
      glitching -= dt;
      const off = rand(-0.9, 0.9);
      text.position.x = off; text.position.y = rand(-0.35, 0.35);
      ghost.position.set(off + rand(-1.4, 1.4) + 0.6, text.position.y, 0);
      ghost.material.opacity = 0.55;
      text.material.opacity = Math.random() < 0.3 ? 0.18 : 0.95;
    } else {
      text.position.x *= 0.6; text.position.y *= 0.6;
      text.material.opacity = 0.92 + Math.random() * 0.08;
      ghost.position.set(text.position.x + 0.2, text.position.y, 0);
      ghost.material.opacity = Math.max(0.12, ghost.material.opacity * 0.86);
    }
  }

  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
